<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <!-- Fundo do jogo Aventura do Re G: trilha na floresta com montanhas, pinheiros e placas -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb8f3"/>
      <stop offset=".6" stop-color="#a9e2fb"/>
      <stop offset="1" stop-color="#e3f7ff"/>
    </linearGradient>
    <linearGradient id="montanha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb4ea"/>
      <stop offset="1" stop-color="#c4d3f4"/>
    </linearGradient>
    <linearGradient id="trilha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dca8"/>
      <stop offset="1" stop-color="#e2b56d"/>
    </linearGradient>
    <symbol id="nuvem" viewBox="0 0 200 90">
      <g fill="#fff">
        <ellipse cx="100" cy="64" rx="96" ry="24"/>
        <circle cx="68" cy="50" r="32"/>
        <circle cx="116" cy="38" r="40"/>
        <circle cx="160" cy="56" r="24"/>
      </g>
    </symbol>
    <symbol id="pinheiro" viewBox="0 0 120 220">
      <rect x="50" y="170" width="20" height="50" rx="4" fill="#8a4f22"/>
      <path d="M60 0 L100 70 H20 Z"/>
      <path d="M60 40 L110 125 H10 Z"/>
      <path d="M60 90 L120 180 H0 Z"/>
      <path d="M60 0 L80 35 L60 30 Z" fill="#ffffff" opacity=".2"/>
    </symbol>
    <symbol id="arvore" viewBox="0 0 160 200">
      <rect x="68" y="110" width="24" height="90" rx="8" fill="#9a6232"/>
      <circle cx="80" cy="70" r="62"/>
      <circle cx="36" cy="104" r="36"/>
      <circle cx="124" cy="104" r="36"/>
      <circle cx="58" cy="50" r="18" fill="#ffffff" opacity=".15"/>
    </symbol>
    <symbol id="placa" viewBox="0 0 140 180">
      <rect x="62" y="40" width="16" height="140" rx="4" fill="#8a4f22"/>
      <rect x="0" y="10" width="140" height="80" rx="12" fill="#c98a4b" stroke="#8a4f22" stroke-width="6"/>
      <circle cx="16" cy="26" r="4" fill="#8a4f22"/><circle cx="124" cy="26" r="4" fill="#8a4f22"/>
    </symbol>
  </defs>

  <style>
    .flutua { animation: flutua 7s ease-in-out infinite; }
    .flutua2 { animation: flutua 8s ease-in-out infinite -3s; }
    .voa { animation: voa 6s ease-in-out infinite; }
    .asa { transform-box: fill-box; transform-origin: center; animation: asa .6s ease-in-out infinite; }
    @keyframes flutua { 50% { transform: translateY(-12px); } }
    @keyframes voa { 50% { transform: translate(30px, -16px); } }
    @keyframes asa { 50% { transform: scaleY(.5); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    text { font-family: "Arial Rounded MT Bold", "Arial Black", Arial, sans-serif; font-weight: 900; fill: #ffffff; text-anchor: middle; paint-order: stroke; stroke: #6b3c1a; stroke-width: 6px; }
  </style>

  <rect width="1600" height="1000" fill="url(#ceu)"/>

  <!-- Sol -->
  <g transform="translate(1180 170)">
    <circle r="100" fill="#fff6b0" opacity=".55"/>
    <circle r="68" fill="#ffd43b"/>
    <ellipse cx="-20" cy="-10" rx="6" ry="9" fill="#5a3a12"/>
    <ellipse cx="20" cy="-10" rx="6" ry="9" fill="#5a3a12"/>
    <path d="M-17 15 Q0 33 17 15" stroke="#5a3a12" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Nuvens -->
  <use href="#nuvem" xlink:href="#nuvem" x="180" y="130" width="230" height="104" class="flutua"/>
  <use href="#nuvem" xlink:href="#nuvem" x="1360" y="110" width="200" height="90" opacity=".9" class="flutua2"/>
  <use href="#nuvem" xlink:href="#nuvem" x="700" y="190" width="170" height="77" opacity=".8" class="flutua2"/>

  <!-- Passarinhos -->
  <g class="voa" stroke="#0f3d79" stroke-width="5" fill="none" stroke-linecap="round">
    <path class="asa" d="M500 260 Q515 245 530 260 Q545 245 560 260"/>
    <path class="asa" d="M580 300 Q592 288 604 300 Q616 288 628 300"/>
  </g>

  <!-- Montanhas ao fundo -->
  <path d="M-40 640 L240 330 L420 520 L640 290 L900 600 L1080 380 L1300 560 L1480 340 L1660 620 V700 H-40 Z" fill="url(#montanha)"/>
  <g fill="#ffffff">
    <path d="M240 330 L196 380 L222 372 L246 392 L270 366 L286 382 Z"/>
    <path d="M640 290 L590 350 L620 340 L646 362 L672 336 L694 352 Z"/>
    <path d="M1080 380 L1046 418 L1070 412 L1090 428 L1112 410 Z"/>
    <path d="M1480 340 L1436 392 L1462 384 L1486 404 L1508 380 L1526 394 Z"/>
  </g>

  <!-- Morros verdes -->
  <path d="M0 680 Q300 600 640 670 T1300 650 T1600 630 V1000 H0 Z" fill="#7ddc8e"/>

  <!-- Pinheiros do fundo -->
  <g fill="#3aae52">
    <use href="#pinheiro" xlink:href="#pinheiro" x="40" y="500" width="110" height="200"/>
    <use href="#pinheiro" xlink:href="#pinheiro" x="140" y="540" width="90" height="165"/>
    <use href="#pinheiro" xlink:href="#pinheiro" x="1380" y="490" width="110" height="200"/>
    <use href="#pinheiro" xlink:href="#pinheiro" x="1480" y="530" width="90" height="165"/>
    <use href="#pinheiro" xlink:href="#pinheiro" x="1290" y="560" width="80" height="147"/>
  </g>

  <path d="M0 760 Q420 700 820 750 T1600 735 V1000 H0 Z" fill="#54c96b"/>

  <!-- Trilha sinuosa -->
  <path d="M700 1000 Q640 900 760 840 Q880 790 820 740 Q780 705 830 680 L860 680 Q820 705 860 740 Q930 800 820 850 Q720 900 900 1000 Z" fill="url(#trilha)"/>
  <g fill="#c98a4b" opacity=".6">
    <ellipse cx="760" cy="950" rx="16" ry="7"/>
    <ellipse cx="820" cy="880" rx="12" ry="5"/>
    <ellipse cx="850" cy="780" rx="10" ry="4"/>
  </g>

  <!-- Árvores redondas da frente -->
  <use href="#arvore" xlink:href="#arvore" x="200" y="660" width="190" height="238" fill="#2f9e44"/>
  <use href="#arvore" xlink:href="#arvore" x="1220" y="670" width="180" height="225" fill="#2f9e44"/>
  <use href="#pinheiro" xlink:href="#pinheiro" x="-20" y="700" width="150" height="275" fill="#2e8a3e"/>
  <use href="#pinheiro" xlink:href="#pinheiro" x="1470" y="690" width="150" height="275" fill="#2e8a3e"/>

  <!-- Placas de madeira com R e G -->
  <use href="#placa" xlink:href="#placa" x="470" y="760" width="120" height="154"/>
  <text x="530" y="830" font-size="58">R</text>
  <use href="#placa" xlink:href="#placa" x="1030" y="770" width="120" height="154"/>
  <text x="1090" y="840" font-size="58">G</text>

  <!-- Cogumelos e flores -->
  <g>
    <rect x="390" y="920" width="14" height="26" rx="4" fill="#fff4dc"/>
    <path d="M375 924 Q397 890 419 924 Z" fill="#ff4d6d"/>
    <circle cx="390" cy="912" r="4" fill="#ffffff"/><circle cx="405" cy="908" r="3" fill="#ffffff"/>
    <rect x="1200" y="930" width="14" height="24" rx="4" fill="#fff4dc"/>
    <path d="M1185 934 Q1207 902 1229 934 Z" fill="#ff9838"/>
    <circle cx="1200" cy="922" r="4" fill="#ffffff"/>
  </g>
  <g fill="#ffd43b">
    <circle cx="620" cy="960" r="7"/><circle cx="960" cy="950" r="7"/><circle cx="130" cy="970" r="7"/><circle cx="1400" cy="960" r="7"/>
  </g>
</svg>
