<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <!-- Fundo do jogo Detetives dos Sons: campo ensolarado com notas musicais, ondas sonoras e pistas -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25a9e8"/>
      <stop offset=".6" stop-color="#9fdcfb"/>
      <stop offset="1" stop-color="#e3f6ff"/>
    </linearGradient>
    <radialGradient id="sol">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset="1" stop-color="#ffb627"/>
    </radialGradient>
    <linearGradient id="morro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be694"/>
      <stop offset="1" stop-color="#4cc35a"/>
    </linearGradient>
    <symbol id="nuvem" viewBox="0 0 200 90">
      <g fill="#fff">
        <ellipse cx="100" cy="64" rx="96" ry="24"/>
        <circle cx="68" cy="50" r="32"/>
        <circle cx="116" cy="38" r="40"/>
        <circle cx="160" cy="56" r="24"/>
      </g>
    </symbol>
    <symbol id="nota" viewBox="0 0 50 80">
      <ellipse cx="16" cy="64" rx="15" ry="11" transform="rotate(-20 16 64)"/>
      <rect x="27" y="6" width="6" height="58" rx="3"/>
      <path d="M30 6 Q50 14 46 34 Q42 22 30 20 Z"/>
    </symbol>
    <symbol id="notaDupla" viewBox="0 0 80 80">
      <ellipse cx="16" cy="66" rx="14" ry="10" transform="rotate(-20 16 66)"/>
      <ellipse cx="60" cy="58" rx="14" ry="10" transform="rotate(-20 60 58)"/>
      <rect x="26" y="10" width="6" height="56" rx="3"/>
      <rect x="70" y="2" width="6" height="56" rx="3"/>
      <path d="M26 10 L76 2 L76 14 L26 22 Z"/>
    </symbol>
    <symbol id="arbusto" viewBox="0 0 200 100">
      <g>
        <circle cx="50" cy="70" r="40"/><circle cx="100" cy="50" r="50"/><circle cx="152" cy="70" r="40"/>
        <rect x="10" y="70" width="180" height="30"/>
      </g>
    </symbol>
    <symbol id="flor" viewBox="-14 -14 28 28">
      <g fill="#fff">
        <circle cy="-7" r="6"/><circle cy="7" r="6"/><circle cx="-7" r="6"/><circle cx="7" r="6"/>
      </g>
      <circle r="5" fill="#ffd43b"/>
    </symbol>
  </defs>

  <style>
    .sobe { animation: sobe 5s ease-in-out infinite; }
    .sobe2 { animation: sobe 6s ease-in-out infinite -2s; }
    .sobe3 { animation: sobe 7s ease-in-out infinite -4s; }
    .onda { transform-box: fill-box; transform-origin: left center; animation: onda 2s ease-out infinite; }
    .onda2 { transform-box: fill-box; transform-origin: left center; animation: onda 2s ease-out infinite -.66s; }
    .onda3 { transform-box: fill-box; transform-origin: left center; animation: onda 2s ease-out infinite -1.33s; }
    .giro { transform-box: fill-box; transform-origin: center; animation: giro 40s linear infinite; }
    @keyframes sobe { 50% { transform: translateY(-18px) rotate(-4deg); } }
    @keyframes onda { 0% { opacity: 0; } 30% { opacity: .9; } 100% { opacity: 0; transform: scale(1.25); } }
    @keyframes giro { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1600" height="1000" fill="url(#ceu)"/>

  <!-- Arco-íris -->
  <g fill="none" stroke-width="20" opacity=".9">
    <path d="M-200 760 A320 320 0 0 1 440 760" stroke="#ff4d6d"/>
    <path d="M-180 760 A300 300 0 0 1 420 760" stroke="#ff9838"/>
    <path d="M-160 760 A280 280 0 0 1 400 760" stroke="#ffd43b"/>
    <path d="M-140 760 A260 260 0 0 1 380 760" stroke="#54c96b"/>
    <path d="M-120 760 A240 240 0 0 1 360 760" stroke="#25a9e8"/>
    <path d="M-100 760 A220 220 0 0 1 340 760" stroke="#9364e8"/>
  </g>

  <!-- Sol -->
  <g transform="translate(1460 300)">
    <g class="giro">
      <circle r="104" fill="none" stroke="#ffe066" stroke-width="10" stroke-dasharray="16 22" stroke-linecap="round"/>
    </g>
    <circle r="76" fill="url(#sol)"/>
    <ellipse cx="-22" cy="-10" rx="7" ry="10" fill="#5a3a12"/>
    <path d="M14 -10 Q22 -18 30 -10" stroke="#5a3a12" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-40" cy="14" rx="11" ry="6" fill="#ff7a6b" opacity=".5"/>
    <ellipse cx="40" cy="14" rx="11" ry="6" fill="#ff7a6b" opacity=".5"/>
    <path d="M-18 18 Q0 38 18 18" stroke="#5a3a12" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Nuvens -->
  <use href="#nuvem" xlink:href="#nuvem" x="380" y="120" width="230" height="104" class="sobe2"/>
  <use href="#nuvem" xlink:href="#nuvem" x="1060" y="150" width="210" height="95" opacity=".9" class="sobe3"/>
  <use href="#nuvem" xlink:href="#nuvem" x="40" y="160" width="170" height="77" opacity=".85" class="sobe"/>

  <!-- Ondas sonoras saindo do alto-falante -->
  <g transform="translate(1180 560)">
    <path d="M0 -18 H20 L48 -44 V44 L20 18 H0 Z" fill="#ffffff" stroke="#087fc5" stroke-width="6" stroke-linejoin="round"/>
    <path class="onda" d="M66 -26 Q84 0 66 26" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path class="onda2" d="M86 -46 Q116 0 86 46" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path class="onda3" d="M106 -66 Q148 0 106 66" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Notas musicais -->
  <use href="#nota" xlink:href="#nota" x="290" y="250" width="50" height="80" fill="#ff4d6d" class="sobe"/>
  <use href="#notaDupla" xlink:href="#notaDupla" x="1040" y="420" width="76" height="76" fill="#9364e8" class="sobe2"/>
  <use href="#nota" xlink:href="#nota" x="1380" y="520" width="44" height="70" fill="#25a9e8" class="sobe3"/>
  <use href="#notaDupla" xlink:href="#notaDupla" x="470" y="430" width="64" height="64" fill="#ff9838" class="sobe3"/>
  <use href="#nota" xlink:href="#nota" x="860" y="160" width="40" height="64" fill="#54c96b" class="sobe"/>

  <!-- Pontos de interrogação de pista -->
  <g font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" fill="#ffffff" opacity=".85">
    <text x="680" y="330" font-size="70" class="sobe2">?</text>
    <text x="1150" y="320" font-size="54" class="sobe">?</text>
    <text x="1530" y="640" font-size="60" class="sobe3">?</text>
  </g>

  <!-- Morros e arbustos -->
  <path d="M0 720 Q300 630 640 700 T1300 690 T1600 660 V1000 H0 Z" fill="url(#morro)"/>
  <use href="#arbusto" xlink:href="#arbusto" x="-40" y="690" width="280" height="140" fill="#3fb653"/>
  <use href="#arbusto" xlink:href="#arbusto" x="1360" y="680" width="300" height="150" fill="#3fb653"/>
  <use href="#arbusto" xlink:href="#arbusto" x="520" y="740" width="200" height="100" fill="#45bb58"/>
  <use href="#arbusto" xlink:href="#arbusto" x="980" y="730" width="220" height="110" fill="#45bb58"/>
  <path d="M0 820 Q420 760 820 810 T1600 790 V1000 H0 Z" fill="#4cc35a"/>
  <path d="M0 910 Q500 870 900 900 T1600 890 V1000 H0 Z" fill="#36a94a"/>

  <!-- Pegadas de detetive -->
  <g fill="#2f9e44" opacity=".55">
    <ellipse cx="620" cy="960" rx="14" ry="22" transform="rotate(-20 620 960)"/>
    <ellipse cx="680" cy="925" rx="14" ry="22" transform="rotate(20 680 925)"/>
    <ellipse cx="740" cy="950" rx="14" ry="22" transform="rotate(-20 740 950)"/>
    <ellipse cx="800" cy="915" rx="14" ry="22" transform="rotate(20 800 915)"/>
    <ellipse cx="860" cy="940" rx="14" ry="22" transform="rotate(-20 860 940)"/>
  </g>

  <!-- Flores -->
  <use href="#flor" xlink:href="#flor" x="80" y="860" width="30" height="30"/>
  <use href="#flor" xlink:href="#flor" x="260" y="920" width="26" height="26"/>
  <use href="#flor" xlink:href="#flor" x="430" y="850" width="24" height="24"/>
  <use href="#flor" xlink:href="#flor" x="1060" y="900" width="28" height="28"/>
  <use href="#flor" xlink:href="#flor" x="1260" y="850" width="24" height="24"/>
  <use href="#flor" xlink:href="#flor" x="1500" y="910" width="30" height="30"/>
</svg>
