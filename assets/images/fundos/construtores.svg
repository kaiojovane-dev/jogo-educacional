<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <!-- Fundo do jogo Construtores de Palavras: canteiro de obras com guindaste e blocos de letras -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc2f5"/>
      <stop offset=".55" stop-color="#bfe6f9"/>
      <stop offset="1" stop-color="#ffe1b8"/>
    </linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c98a"/>
      <stop offset="1" stop-color="#d9a35c"/>
    </linearGradient>
    <pattern id="trelica" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#ffd43b"/>
      <path d="M0 0 L40 40 M40 0 L0 40" stroke="#e8a500" stroke-width="5"/>
      <rect width="40" height="40" fill="none" stroke="#e8a500" stroke-width="5"/>
    </pattern>
    <pattern id="faixa" width="60" height="40" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <rect width="30" height="40" fill="#ff9838"/>
      <rect x="30" width="30" height="40" fill="#ffffff"/>
    </pattern>
    <symbol id="nuvem" viewBox="0 0 200 90">
      <g fill="#fff">
        <ellipse cx="100" cy="64" rx="96" ry="24"/>
        <circle cx="68" cy="50" r="32"/>
        <circle cx="116" cy="38" r="40"/>
        <circle cx="160" cy="56" r="24"/>
      </g>
    </symbol>
    <symbol id="cone" viewBox="0 0 80 100">
      <rect x="0" y="86" width="80" height="14" rx="4" fill="#d9661a"/>
      <path d="M28 0 H52 L72 88 H8 Z" fill="#ff9838"/>
      <path d="M22 30 H58 L62 48 H18 Z" fill="#ffffff"/>
      <path d="M14 64 H66 L69 76 H11 Z" fill="#ffffff"/>
    </symbol>
  </defs>

  <style>
    .flutua { animation: flutua 6s ease-in-out infinite; }
    .flutua2 { animation: flutua 7.5s ease-in-out infinite -3s; }
    .gancho { transform-box: view-box; transform-origin: 1180px 210px; animation: pendulo 5s ease-in-out infinite; }
    .giro { transform-box: fill-box; transform-origin: center; animation: giro 40s linear infinite; }
    @keyframes flutua { 50% { transform: translateY(-14px); } }
    @keyframes pendulo { 50% { transform: rotate(-5deg); } 0%, 100% { transform: rotate(5deg); } }
    @keyframes giro { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    text { font-family: "Arial Rounded MT Bold", "Arial Black", Arial, sans-serif; font-weight: 900; fill: #ffffff; text-anchor: middle; }
  </style>

  <rect width="1600" height="1000" fill="url(#ceu)"/>

  <!-- Sol -->
  <g transform="translate(160 160)">
    <g class="giro">
      <circle r="96" fill="none" stroke="#ffe066" stroke-width="10" stroke-dasharray="16 20" stroke-linecap="round"/>
    </g>
    <circle r="70" fill="#ffd43b"/>
    <ellipse cx="-20" cy="-10" rx="6" ry="9" fill="#5a3a12"/>
    <ellipse cx="20" cy="-10" rx="6" ry="9" fill="#5a3a12"/>
    <path d="M-17 15 Q0 33 17 15" stroke="#5a3a12" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Nuvens -->
  <use href="#nuvem" xlink:href="#nuvem" x="360" y="120" width="220" height="99" class="flutua"/>
  <use href="#nuvem" xlink:href="#nuvem" x="760" y="200" width="180" height="81" opacity=".85" class="flutua2"/>

  <!-- Prédios em construção ao fundo -->
  <g opacity=".55">
    <rect x="420" y="470" width="140" height="300" fill="#ffffff"/>
    <rect x="580" y="530" width="110" height="240" fill="#ffffff"/>
    <rect x="900" y="500" width="130" height="270" fill="#ffffff"/>
    <g fill="#bfe6f9">
      <rect x="440" y="500" width="34" height="30"/><rect x="505" y="500" width="34" height="30"/>
      <rect x="440" y="560" width="34" height="30"/><rect x="505" y="560" width="34" height="30"/>
      <rect x="600" y="560" width="30" height="28"/><rect x="645" y="560" width="30" height="28"/>
      <rect x="920" y="530" width="34" height="30"/><rect x="980" y="530" width="34" height="30"/>
    </g>
  </g>

  <!-- Guindaste -->
  <g>
    <rect x="1340" y="190" width="70" height="610" fill="url(#trelica)"/>
    <rect x="1080" y="170" width="480" height="44" fill="url(#trelica)"/>
    <path d="M1375 90 L1340 170 H1410 Z" fill="#e8a500"/>
    <path d="M1375 92 L1090 172" stroke="#8a5a2b" stroke-width="4"/>
    <path d="M1375 92 L1550 172" stroke="#8a5a2b" stroke-width="4"/>
    <rect x="1470" y="214" width="80" height="60" rx="6" fill="#7a8a9a"/>
    <rect x="1310" y="200" width="60" height="56" rx="10" fill="#25a9e8" stroke="#ffffff" stroke-width="4"/>
    <rect x="1320" y="208" width="40" height="22" rx="4" fill="#bfe6f9"/>
    <rect x="1170" y="214" width="20" height="16" fill="#8a5a2b"/>
    <g class="gancho">
      <rect x="1178" y="210" width="4" height="190" fill="#4a4a4a"/>
      <path d="M1180 400 Q1166 400 1166 414 Q1166 426 1180 426" stroke="#4a4a4a" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M1180 420 L1140 450 M1180 420 L1220 450" stroke="#4a4a4a" stroke-width="4"/>
      <rect x="1130" y="450" width="100" height="100" rx="16" fill="#9364e8"/>
      <rect x="1130" y="450" width="100" height="100" rx="16" fill="none" stroke="#ffffff" stroke-width="5" opacity=".6"/>
      <text x="1180" y="525" font-size="72">A</text>
    </g>
  </g>

  <!-- Chão de terra -->
  <path d="M0 760 Q400 720 800 750 T1600 740 V1000 H0 Z" fill="url(#chao)"/>
  <path d="M0 760 Q400 720 800 750 T1600 740 V770 Q1200 750 800 780 T0 790 Z" fill="#7ddc8e"/>

  <!-- Pirâmide de blocos de letras à esquerda -->
  <g>
    <rect x="60" y="770" width="110" height="110" rx="16" fill="#ff4d6d"/>
    <rect x="176" y="770" width="110" height="110" rx="16" fill="#25a9e8"/>
    <rect x="292" y="770" width="110" height="110" rx="16" fill="#ffd43b"/>
    <rect x="118" y="654" width="110" height="110" rx="16" fill="#54c96b"/>
    <rect x="234" y="654" width="110" height="110" rx="16" fill="#ff9838"/>
    <rect x="176" y="538" width="110" height="110" rx="16" fill="#f05b9b"/>
    <g fill="#ffffff" opacity=".25">
      <rect x="66" y="776" width="98" height="20" rx="10"/><rect x="182" y="776" width="98" height="20" rx="10"/>
      <rect x="298" y="776" width="98" height="20" rx="10"/><rect x="124" y="660" width="98" height="20" rx="10"/>
      <rect x="240" y="660" width="98" height="20" rx="10"/><rect x="182" y="544" width="98" height="20" rx="10"/>
    </g>
    <text x="115" y="852" font-size="72">C</text>
    <text x="231" y="852" font-size="72">A</text>
    <text x="347" y="852" font-size="72" style="fill:#7a4d00">S</text>
    <text x="173" y="736" font-size="72">B</text>
    <text x="289" y="736" font-size="72">O</text>
    <text x="231" y="620" font-size="72">L</text>
  </g>

  <!-- Cones -->
  <use href="#cone" xlink:href="#cone" x="460" y="810" width="64" height="80"/>
  <use href="#cone" xlink:href="#cone" x="1180" y="800" width="72" height="90"/>
  <use href="#cone" xlink:href="#cone" x="1500" y="810" width="64" height="80"/>

  <!-- Carrinho de mão com tijolos -->
  <g transform="translate(1230 850)">
    <path d="M0 0 H150 L130 50 H20 Z" fill="#25a9e8"/>
    <rect x="22" y="-24" width="40" height="24" rx="4" fill="#e07818"/>
    <rect x="68" y="-24" width="40" height="24" rx="4" fill="#ff9838"/>
    <rect x="45" y="-46" width="40" height="22" rx="4" fill="#e07818"/>
    <circle cx="40" cy="62" r="18" fill="#3b3b3b"/>
    <circle cx="40" cy="62" r="7" fill="#bfc9d6"/>
    <path d="M150 0 L210 -20" stroke="#8a5a2b" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Faixa de obra -->
  <rect x="0" y="950" width="1600" height="50" fill="url(#faixa)"/>
  <rect x="0" y="946" width="1600" height="6" fill="#d9661a"/>
</svg>
