<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <!-- Fundo do jogo Missão Palavra Mágica: céu mágico de entardecer com lua, estrelas e castelo -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1d7a"/>
      <stop offset=".5" stop-color="#8a5ad8"/>
      <stop offset="1" stop-color="#f6a6cf"/>
    </linearGradient>
    <radialGradient id="lua">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="1" stop-color="#ffe680"/>
    </radialGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#fff6c2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff6c2" stop-opacity="0"/>
    </radialGradient>
    <symbol id="estrela" viewBox="-22 -22 44 44">
      <path d="M0 -20 L5.9 -8.1 L19 -6.2 L9.5 3.1 L11.8 16.2 L0 10 L-11.8 16.2 L-9.5 3.1 L-19 -6.2 L-5.9 -8.1 Z"/>
    </symbol>
    <symbol id="brilho" viewBox="-10 -10 20 20">
      <path d="M0 -10 Q1.5 -1.5 10 0 Q1.5 1.5 0 10 Q-1.5 1.5 -10 0 Q-1.5 -1.5 0 -10 Z"/>
    </symbol>
    <symbol id="nuvem" viewBox="0 0 200 90">
      <ellipse cx="100" cy="64" rx="96" ry="24"/>
      <circle cx="68" cy="50" r="32"/>
      <circle cx="116" cy="38" r="40"/>
      <circle cx="160" cy="56" r="24"/>
    </symbol>
  </defs>

  <style>
    .pisca { transform-box: fill-box; transform-origin: center; animation: pisca 2.6s ease-in-out infinite; }
    .pisca2 { transform-box: fill-box; transform-origin: center; animation: pisca 3.2s ease-in-out infinite -1.4s; }
    .pisca3 { transform-box: fill-box; transform-origin: center; animation: pisca 2.2s ease-in-out infinite -.8s; }
    .flutua { animation: flutua 7s ease-in-out infinite; }
    .cadente { animation: cadente 7s ease-in infinite 1s; opacity: 0; }
    @keyframes pisca { 50% { opacity: .3; transform: scale(.65); } }
    @keyframes flutua { 50% { transform: translateY(-12px); } }
    @keyframes cadente { 0% { opacity: 0; transform: translate(0, 0); } 4% { opacity: 1; } 16% { opacity: 0; transform: translate(-520px, 260px); } 100% { opacity: 0; transform: translate(-520px, 260px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .cadente { opacity: 0; } }
  </style>

  <rect width="1600" height="1000" fill="url(#ceu)"/>

  <!-- Lua sorridente -->
  <g transform="translate(1400 190)">
    <circle r="150" fill="url(#aura)"/>
    <circle r="78" fill="url(#lua)"/>
    <circle cx="26" cy="-30" r="12" fill="#f5d96a" opacity=".6"/>
    <circle cx="-30" cy="34" r="8" fill="#f5d96a" opacity=".6"/>
    <path d="M-30 -6 Q-22 -14 -14 -6" stroke="#6b4a8a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M14 -6 Q22 -14 30 -6" stroke="#6b4a8a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-38" cy="12" rx="10" ry="6" fill="#ff9ec7" opacity=".6"/>
    <ellipse cx="38" cy="12" rx="10" ry="6" fill="#ff9ec7" opacity=".6"/>
    <path d="M-14 16 Q0 30 14 16" stroke="#6b4a8a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Estrela cadente -->
  <g class="cadente">
    <path d="M1240 120 L1420 40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    <use href="#estrela" xlink:href="#estrela" x="1222" y="102" width="36" height="36" fill="#ffd43b"/>
  </g>

  <!-- Estrelas -->
  <g fill="#ffd43b">
    <use href="#estrela" xlink:href="#estrela" x="120" y="120" width="40" height="40" class="pisca"/>
    <use href="#estrela" xlink:href="#estrela" x="380" y="220" width="28" height="28" class="pisca2"/>
    <use href="#estrela" xlink:href="#estrela" x="640" y="110" width="34" height="34" class="pisca3"/>
    <use href="#estrela" xlink:href="#estrela" x="900" y="230" width="26" height="26" class="pisca"/>
    <use href="#estrela" xlink:href="#estrela" x="1120" y="300" width="36" height="36" class="pisca2"/>
    <use href="#estrela" xlink:href="#estrela" x="1520" y="420" width="30" height="30" class="pisca3"/>
    <use href="#estrela" xlink:href="#estrela" x="60" y="400" width="32" height="32" class="pisca2"/>
  </g>
  <g fill="#ffffff">
    <use href="#brilho" xlink:href="#brilho" x="250" y="160" width="20" height="20" class="pisca3"/>
    <use href="#brilho" xlink:href="#brilho" x="520" y="300" width="16" height="16" class="pisca"/>
    <use href="#brilho" xlink:href="#brilho" x="780" y="180" width="18" height="18" class="pisca2"/>
    <use href="#brilho" xlink:href="#brilho" x="1010" y="120" width="20" height="20" class="pisca3"/>
    <use href="#brilho" xlink:href="#brilho" x="1250" y="400" width="16" height="16" class="pisca"/>
    <use href="#brilho" xlink:href="#brilho" x="1560" y="300" width="18" height="18" class="pisca2"/>
    <use href="#brilho" xlink:href="#brilho" x="200" y="330" width="16" height="16" class="pisca"/>
    <use href="#brilho" xlink:href="#brilho" x="1330" y="520" width="18" height="18" class="pisca3"/>
  </g>
  <g fill="#ffffff" opacity=".7">
    <circle cx="320" cy="90" r="3"/><circle cx="470" cy="150" r="2.5"/><circle cx="560" cy="60" r="3"/>
    <circle cx="840" cy="80" r="2.5"/><circle cx="960" cy="320" r="3"/><circle cx="1180" cy="90" r="2.5"/>
    <circle cx="40" cy="250" r="3"/><circle cx="700" cy="350" r="2.5"/><circle cx="1260" cy="230" r="3"/>
  </g>

  <!-- Trilha de magia -->
  <path d="M60 620 C260 480 380 700 560 560 S900 420 1040 520" stroke="#ffe680" stroke-width="5" stroke-dasharray="2 18" stroke-linecap="round" fill="none" opacity=".8"/>

  <!-- Castelo à esquerda -->
  <g transform="translate(120 520)" fill="#5a2fa8">
    <rect x="0" y="80" width="70" height="220"/>
    <path d="M-10 84 L35 0 L80 84 Z" fill="#f05b9b"/>
    <rect x="70" y="140" width="140" height="160"/>
    <rect x="210" y="60" width="70" height="240"/>
    <path d="M200 64 L245 -30 L290 64 Z" fill="#f05b9b"/>
    <g>
      <rect x="70" y="122" width="22" height="22"/><rect x="106" y="122" width="22" height="22"/>
      <rect x="142" y="122" width="22" height="22"/><rect x="178" y="122" width="22" height="22"/>
    </g>
    <path d="M115 300 V240 Q140 210 165 240 V300 Z" fill="#3b1d7a"/>
    <g fill="#ffe680">
      <rect x="24" y="130" width="22" height="32" rx="11"/>
      <rect x="234" y="110" width="22" height="32" rx="11"/>
      <rect x="234" y="180" width="22" height="32" rx="11"/>
    </g>
    <rect x="33" y="-30" width="4" height="34" fill="#3b1d7a"/>
    <path d="M37 -30 L64 -22 L37 -14 Z" fill="#ffd43b"/>
  </g>

  <!-- Nuvens rosadas -->
  <use href="#nuvem" xlink:href="#nuvem" x="380" y="420" width="220" height="99" fill="#f9c6e0" opacity=".7" class="flutua"/>
  <use href="#nuvem" xlink:href="#nuvem" x="1060" y="560" width="240" height="108" fill="#f9c6e0" opacity=".65" class="flutua"/>

  <!-- Colinas lilás -->
  <path d="M0 760 Q360 680 760 740 T1600 710 V1000 H0 Z" fill="#b083e8"/>
  <path d="M0 850 Q420 790 820 840 T1600 820 V1000 H0 Z" fill="#9364e8"/>
  <path d="M0 940 Q500 900 900 930 T1600 915 V1000 H0 Z" fill="#7a48d6"/>

  <!-- Livro mágico aberto à direita -->
  <g transform="translate(1340 780)" class="flutua">
    <ellipse cx="0" cy="-60" rx="120" ry="70" fill="url(#aura)"/>
    <path d="M0 0 Q-60 -30 -120 -10 V50 Q-60 30 0 60 Z" fill="#fff4dc" stroke="#e8d3b0" stroke-width="4"/>
    <path d="M0 0 Q60 -30 120 -10 V50 Q60 30 0 60 Z" fill="#fff4dc" stroke="#e8d3b0" stroke-width="4"/>
    <path d="M-120 50 Q-60 30 0 60 Q60 30 120 50 V62 Q60 42 0 72 Q-60 42 -120 62 Z" fill="#f05b9b"/>
    <g stroke="#d9c39a" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M-100 8 Q-60 -8 -20 12"/><path d="M-100 24 Q-60 8 -20 28"/>
      <path d="M20 12 Q60 -8 100 8"/><path d="M20 28 Q60 8 100 24"/>
    </g>
    <use href="#brilho" xlink:href="#brilho" x="-50" y="-110" width="24" height="24" fill="#ffffff" class="pisca"/>
    <use href="#estrela" xlink:href="#estrela" x="14" y="-150" width="30" height="30" fill="#ffd43b" class="pisca2"/>
    <use href="#brilho" xlink:href="#brilho" x="50" y="-80" width="18" height="18" fill="#ffffff" class="pisca3"/>
  </g>
</svg>
