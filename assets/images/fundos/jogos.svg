<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <!-- Fundo da tela Jogos: Praça da Diversão com a tenda do circo do Patati Patatá -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fb2f6"/>
      <stop offset=".6" stop-color="#8fd8fb"/>
      <stop offset="1" stop-color="#dcf4ff"/>
    </linearGradient>
    <radialGradient id="sol">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset="1" stop-color="#ffb627"/>
    </radialGradient>
    <linearGradient id="morroFundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be694"/>
      <stop offset="1" stop-color="#4cc35a"/>
    </linearGradient>
    <linearGradient id="morroFrente" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62d26c"/>
      <stop offset="1" stop-color="#2f9e44"/>
    </linearGradient>
    <pattern id="listras" width="56" height="10" patternUnits="userSpaceOnUse">
      <rect width="28" height="10" fill="#ff4d6d"/>
      <rect x="28" width="28" height="10" fill="#fffaf0"/>
    </pattern>
    <symbol id="nuvem" viewBox="0 0 200 90">
      <g fill="#fff">
        <ellipse cx="100" cy="64" rx="96" ry="24"/>
        <circle cx="68" cy="50" r="32"/>
        <circle cx="116" cy="38" r="40"/>
        <circle cx="160" cy="56" r="24"/>
      </g>
    </symbol>
    <symbol id="flor" viewBox="-14 -14 28 28">
      <g fill="#fff">
        <circle cy="-7" r="6"/><circle cy="7" r="6"/><circle cx="-7" r="6"/><circle cx="7" r="6"/>
      </g>
      <circle r="5" fill="#ffd43b"/>
    </symbol>
    <symbol id="balao" viewBox="0 0 60 150">
      <path d="M30 80 Q24 110 34 150" stroke="#ffffff" stroke-width="2" fill="none" opacity=".9"/>
      <ellipse cx="30" cy="38" rx="28" ry="36"/>
      <path d="M24 74 L36 74 L30 82 Z"/>
      <ellipse cx="20" cy="24" rx="7" ry="11" fill="#fff" opacity=".45"/>
    </symbol>
  </defs>

  <style>
    .bob { animation: bob 6s ease-in-out infinite; }
    .bob2 { animation: bob 7.5s ease-in-out infinite -2s; }
    .giro { transform-box: fill-box; transform-origin: center; animation: giro 40s linear infinite; }
    .bandeira { transform-box: fill-box; transform-origin: left center; animation: tremula 1.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-14px); } }
    @keyframes giro { to { transform: rotate(360deg); } }
    @keyframes tremula { 50% { transform: scaleX(.82) skewY(4deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1600" height="1000" fill="url(#ceu)"/>

  <!-- Arco-íris -->
  <g fill="none" stroke-width="22" opacity=".9">
    <path d="M-160 740 A340 340 0 0 1 520 740" stroke="#ff4d6d"/>
    <path d="M-138 740 A318 318 0 0 1 498 740" stroke="#ff9838"/>
    <path d="M-116 740 A296 296 0 0 1 476 740" stroke="#ffd43b"/>
    <path d="M-94 740 A274 274 0 0 1 454 740" stroke="#54c96b"/>
    <path d="M-72 740 A252 252 0 0 1 432 740" stroke="#25a9e8"/>
    <path d="M-50 740 A230 230 0 0 1 410 740" stroke="#9364e8"/>
  </g>

  <!-- Sol sorridente -->
  <g transform="translate(1440 170)">
    <g class="giro">
      <circle r="112" fill="none" stroke="#ffe066" stroke-width="10" stroke-dasharray="18 22" stroke-linecap="round"/>
    </g>
    <circle r="82" fill="url(#sol)"/>
    <ellipse cx="-24" cy="-12" rx="7" ry="10" fill="#5a3a12"/>
    <ellipse cx="24" cy="-12" rx="7" ry="10" fill="#5a3a12"/>
    <ellipse cx="-42" cy="14" rx="12" ry="7" fill="#ff7a6b" opacity=".5"/>
    <ellipse cx="42" cy="14" rx="12" ry="7" fill="#ff7a6b" opacity=".5"/>
    <path d="M-20 18 Q0 40 20 18" stroke="#5a3a12" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Nuvens -->
  <use href="#nuvem" xlink:href="#nuvem" x="520" y="120" width="240" height="108" class="bob"/>
  <use href="#nuvem" xlink:href="#nuvem" x="1000" y="250" width="200" height="90" opacity=".9" class="bob2"/>
  <use href="#nuvem" xlink:href="#nuvem" x="80" y="140" width="180" height="81" opacity=".85" class="bob2"/>

  <!-- Morros do fundo -->
  <path d="M0 690 Q260 590 560 680 T1160 670 T1600 640 V1000 H0 Z" fill="url(#morroFundo)"/>

  <!-- Tenda do circo -->
  <g>
    <rect x="600" y="520" width="400" height="200" fill="url(#listras)"/>
    <path d="M760 720 L800 610 L840 720 Z" fill="#7a1b3a"/>
    <path d="M800 300 L560 525 L620 525 Z" fill="#ff4d6d"/>
    <path d="M800 300 L620 525 L680 525 Z" fill="#ffd43b"/>
    <path d="M800 300 L680 525 L740 525 Z" fill="#ff4d6d"/>
    <path d="M800 300 L740 525 L800 525 Z" fill="#ffd43b"/>
    <path d="M800 300 L800 525 L860 525 Z" fill="#ff4d6d"/>
    <path d="M800 300 L860 525 L920 525 Z" fill="#ffd43b"/>
    <path d="M800 300 L920 525 L980 525 Z" fill="#ff4d6d"/>
    <path d="M800 300 L980 525 L1040 525 Z" fill="#ffd43b"/>
    <g fill="#25a9e8">
      <circle cx="590" cy="525" r="30"/><circle cx="710" cy="525" r="30"/><circle cx="830" cy="525" r="30"/><circle cx="950" cy="525" r="30"/>
    </g>
    <g fill="#54c96b">
      <circle cx="650" cy="525" r="30"/><circle cx="770" cy="525" r="30"/><circle cx="890" cy="525" r="30"/><circle cx="1010" cy="525" r="30"/>
    </g>
    <rect x="796" y="236" width="8" height="70" rx="4" fill="#8a5a2b"/>
    <path class="bandeira" d="M804 240 L860 256 L804 272 Z" fill="#ff4d6d"/>
  </g>

  <!-- Varal de bandeirinhas -->
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity=".95">
    <path d="M800 250 Q400 290 0 170"/>
    <path d="M800 250 Q1200 290 1600 170"/>
  </g>
  <g>
    <path d="M698 256 L742 256 L720 300 Z" fill="#ffd43b"/>
    <path d="M618 260 L662 260 L640 304 Z" fill="#25a9e8"/>
    <path d="M538 260 L582 260 L560 304 Z" fill="#ff4d6d"/>
    <path d="M458 256 L502 256 L480 300 Z" fill="#54c96b"/>
    <path d="M378 250 L422 250 L400 294 Z" fill="#9364e8"/>
    <path d="M298 240 L342 240 L320 284 Z" fill="#ff9838"/>
    <path d="M218 228 L262 228 L240 272 Z" fill="#ffd43b"/>
    <path d="M138 212 L182 212 L160 256 Z" fill="#25a9e8"/>
    <path d="M58 192 L102 192 L80 236 Z" fill="#ff4d6d"/>
    <path d="M858 256 L902 256 L880 300 Z" fill="#ffd43b"/>
    <path d="M938 260 L982 260 L960 304 Z" fill="#25a9e8"/>
    <path d="M1018 260 L1062 260 L1040 304 Z" fill="#ff4d6d"/>
    <path d="M1098 256 L1142 256 L1120 300 Z" fill="#54c96b"/>
    <path d="M1178 250 L1222 250 L1200 294 Z" fill="#9364e8"/>
    <path d="M1258 240 L1302 240 L1280 284 Z" fill="#ff9838"/>
    <path d="M1338 228 L1382 228 L1360 272 Z" fill="#ffd43b"/>
    <path d="M1418 212 L1462 212 L1440 256 Z" fill="#25a9e8"/>
    <path d="M1498 192 L1542 192 L1520 236 Z" fill="#ff4d6d"/>
  </g>

  <!-- Árvores redondas nas laterais -->
  <g>
    <rect x="132" y="600" width="22" height="110" rx="8" fill="#9a6232"/>
    <circle cx="143" cy="580" r="70" fill="#3fb653"/>
    <circle cx="105" cy="610" r="44" fill="#4cc35a"/>
    <circle cx="180" cy="612" r="46" fill="#36a94a"/>
    <rect x="1450" y="610" width="22" height="100" rx="8" fill="#9a6232"/>
    <circle cx="1461" cy="590" r="64" fill="#3fb653"/>
    <circle cx="1425" cy="616" r="40" fill="#4cc35a"/>
    <circle cx="1498" cy="618" r="42" fill="#36a94a"/>
  </g>

  <!-- Gramado da frente -->
  <path d="M0 790 Q400 720 800 780 T1600 760 V1000 H0 Z" fill="url(#morroFrente)"/>
  <path d="M0 900 Q500 860 900 895 T1600 880 V1000 H0 Z" fill="#2a9140" opacity=".55"/>

  <!-- Flores -->
  <use href="#flor" xlink:href="#flor" x="60" y="820" width="30" height="30"/>
  <use href="#flor" xlink:href="#flor" x="230" y="880" width="26" height="26"/>
  <use href="#flor" xlink:href="#flor" x="420" y="830" width="24" height="24"/>
  <use href="#flor" xlink:href="#flor" x="640" y="910" width="30" height="30"/>
  <use href="#flor" xlink:href="#flor" x="930" y="860" width="26" height="26"/>
  <use href="#flor" xlink:href="#flor" x="1150" y="920" width="30" height="30"/>
  <use href="#flor" xlink:href="#flor" x="1330" y="830" width="24" height="24"/>
  <use href="#flor" xlink:href="#flor" x="1520" y="890" width="28" height="28"/>

  <!-- Balões -->
  <g class="bob">
    <use href="#balao" xlink:href="#balao" x="260" y="560" width="60" height="150" fill="#ff4d6d"/>
    <use href="#balao" xlink:href="#balao" x="300" y="590" width="54" height="135" fill="#ffd43b"/>
  </g>
  <g class="bob2">
    <use href="#balao" xlink:href="#balao" x="1260" y="570" width="60" height="150" fill="#9364e8"/>
    <use href="#balao" xlink:href="#balao" x="1300" y="600" width="54" height="135" fill="#25a9e8"/>
  </g>
</svg>
