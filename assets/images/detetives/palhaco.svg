<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hatBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="noseRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="flowerYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="clownShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0f3d79" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="178" rx="60" ry="12" fill="#0f3d79" opacity="0.12"/>

  <g filter="url(#clownShadow)">
    <!-- Colorful Clown Curly Hair Bundles -->
    <!-- Left Hair Bundles (Red, Yellow, Cyan) -->
    <circle cx="50" cy="85" r="14" fill="#ef4444"/>
    <circle cx="45" cy="102" r="13" fill="#eab308"/>
    <circle cx="52" cy="118" r="13" fill="#06b6d4"/>
    <!-- Right Hair Bundles -->
    <circle cx="150" cy="85" r="14" fill="#06b6d4"/>
    <circle cx="155" cy="102" r="13" fill="#eab308"/>
    <circle cx="148" cy="118" r="13" fill="#ef4444"/>

    <!-- Clown Head / Face -->
    <circle cx="100" cy="100" r="50" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>

    <!-- Blue Clown Hat (similar to Patati) -->
    <!-- Hat Brim -->
    <ellipse cx="100" cy="62" rx="48" ry="12" fill="url(#hatBlue)"/>
    <!-- Hat Crown -->
    <path d="M 68 60 C 68 32, 75 22, 100 22 C 125 22, 132 32, 132 60 Z" fill="url(#hatBlue)"/>
    <!-- Yellow Ribbon on Hat -->
    <path d="M 69 54 Q 100 60, 131 54 L 132 60 Q 100 66, 68 60 Z" fill="url(#flowerYellow)"/>
    <!-- Cute Daisy Flower on Hat -->
    <g transform="translate(100, 36)">
      <circle cx="0" cy="-7" r="5" fill="#ffffff"/>
      <circle cx="7" cy="-2" r="5" fill="#ffffff"/>
      <circle cx="4" cy="6" r="5" fill="#ffffff"/>
      <circle cx="-4" cy="6" r="5" fill="#ffffff"/>
      <circle cx="-7" cy="-2" r="5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="4.5" fill="url(#flowerYellow)"/>
    </g>

    <!-- Clown Eyes -->
    <ellipse cx="80" cy="92" rx="7" ry="10" fill="#1e293b"/>
    <circle cx="78" cy="88" r="3" fill="#ffffff"/>
    <circle cx="82" cy="94" r="1.2" fill="#ffffff"/>

    <ellipse cx="120" cy="92" rx="7" ry="10" fill="#1e293b"/>
    <circle cx="118" cy="88" r="3" fill="#ffffff"/>
    <circle cx="122" cy="94" r="1.2" fill="#ffffff"/>

    <!-- Eyebrows -->
    <path d="M 72 80 Q 80 74, 88 80" stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 112 80 Q 120 74, 128 80" stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- White Clown Smile Background -->
    <ellipse cx="100" cy="116" rx="30" ry="18" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>

    <!-- Red Painted Big Clown Smile with Teeth -->
    <path d="M 78 114 Q 100 134, 122 114 Q 100 124, 78 114 Z" fill="#ef4444"/>

    <!-- Big Round Shiny Red Nose -->
    <circle cx="100" cy="102" r="13" fill="url(#noseRed)"/>
    <circle cx="96" cy="98" r="4" fill="#ffffff" opacity="0.8"/>

    <!-- Bow Tie Below -->
    <g transform="translate(100, 150)">
      <polygon points="0,0 -24,-12 -24,12" fill="#38bdf8"/>
      <polygon points="0,0 24,-12 24,12" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="6" fill="#eab308"/>
    </g>
  </g>
</svg>
