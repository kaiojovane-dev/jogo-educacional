<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="zebraBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="muzzleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadowZ" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0f3d79" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="175" rx="60" ry="12" fill="#0f3d79" opacity="0.12"/>

  <g filter="url(#shadowZ)">
    <!-- Mane on top/back of head -->
    <path d="M 90 28 C 90 28, 100 15, 110 28 C 110 28, 120 18, 128 32 C 128 32, 138 25, 142 42 L 125 55 Z" fill="#1e293b"/>

    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M 65 52 C 60 30, 75 22, 85 45 Z" fill="url(#zebraBody)" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 68 48 C 65 35, 75 30, 80 44 Z" fill="url(#earPink)"/>

    <!-- Right Ear -->
    <path d="M 135 52 C 140 30, 125 22, 115 45 Z" fill="url(#zebraBody)" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 132 48 C 135 35, 125 30, 120 44 Z" fill="url(#earPink)"/>

    <!-- Head -->
    <ellipse cx="100" cy="85" rx="52" ry="46" fill="url(#zebraBody)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Black Zebra Stripes on Head -->
    <!-- Forehead stripes -->
    <path d="M 98 42 L 102 42 L 100 58 Z" fill="#1e293b"/>
    <!-- Left cheek stripes -->
    <path d="M 50 78 L 72 82 L 70 87 L 50 83 Z" fill="#1e293b"/>
    <path d="M 52 92 L 68 95 L 67 99 L 54 97 Z" fill="#1e293b"/>
    <!-- Right cheek stripes -->
    <path d="M 150 78 L 128 82 L 130 87 L 150 83 Z" fill="#1e293b"/>
    <path d="M 148 92 L 132 95 L 133 99 L 146 97 Z" fill="#1e293b"/>

    <!-- Big Cute Cartoon Eyes -->
    <!-- Left Eye -->
    <ellipse cx="78" cy="80" rx="9" ry="12" fill="#1e293b"/>
    <circle cx="76" cy="76" r="4" fill="#ffffff"/>
    <circle cx="81" cy="84" r="1.5" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="122" cy="80" rx="9" ry="12" fill="#1e293b"/>
    <circle cx="120" cy="76" r="4" fill="#ffffff"/>
    <circle cx="125" cy="84" r="1.5" fill="#ffffff"/>

    <!-- Rosy Blushing Cheeks -->
    <ellipse cx="62" cy="98" rx="8" ry="5" fill="#fda4af" opacity="0.75"/>
    <ellipse cx="138" cy="98" rx="8" ry="5" fill="#fda4af" opacity="0.75"/>

    <!-- Muzzle / Snout -->
    <ellipse cx="100" cy="116" rx="35" ry="24" fill="url(#muzzleGrad)"/>

    <!-- Nostrils -->
    <ellipse cx="90" cy="115" rx="4" ry="5" fill="#0f172a"/>
    <ellipse cx="110" cy="115" rx="4" ry="5" fill="#0f172a"/>

    <!-- Smiling Mouth -->
    <path d="M 92 125 Q 100 134, 108 125" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
