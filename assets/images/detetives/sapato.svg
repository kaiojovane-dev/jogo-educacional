<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="shoeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shoeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="starYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0f3d79" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="165" rx="72" ry="12" fill="#0f3d79" opacity="0.12"/>

  <!-- Shoe Body -->
  <g filter="url(#shadow)">
    <!-- Main Shoe Upper -->
    <path d="M 40 120 C 40 95, 65 70, 95 80 L 125 105 C 145 110, 165 115, 172 135 C 172 145, 160 148, 140 148 L 45 148 C 38 148, 38 135, 40 120 Z" fill="url(#shoeBlue)"/>

    <!-- Heel / Back Collar -->
    <path d="M 42 118 C 42 96, 58 75, 78 75 C 88 75, 95 82, 95 90 C 80 92, 60 102, 50 120 Z" fill="url(#shoeRed)"/>

    <!-- Toe Cap -->
    <path d="M 135 110 C 150 112, 168 120, 172 136 L 138 138 C 132 125, 133 116, 135 110 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- White Rubber Sole -->
    <path d="M 32 142 C 32 142, 35 138, 42 138 L 165 138 C 175 138, 178 145, 175 152 C 172 158, 162 160, 150 160 L 42 160 C 34 160, 30 152, 32 142 Z" fill="url(#soleGrad)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Sole Texture Stripe -->
    <path d="M 35 148 L 172 148" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Laces Eyelets and Laces -->
    <circle cx="95" cy="98" r="4" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="112" cy="108" r="4" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="128" cy="118" r="4" fill="#ffffff" stroke="#cbd5e1"/>

    <!-- White Criss-cross Laces -->
    <path d="M 95 98 Q 105 106, 112 108" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 112 108 Q 120 115, 128 118" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Cute Bow Knot on Top -->
    <ellipse cx="88" cy="90" rx="9" ry="5" fill="#ffffff" transform="rotate(-30 88 90)"/>
    <ellipse cx="98" cy="88" rx="9" ry="5" fill="#ffffff" transform="rotate(30 98 88)"/>
    <circle cx="93" cy="91" r="3.5" fill="#e2e8f0"/>

    <!-- Cute Star Badge on Side -->
    <g transform="translate(75, 112) scale(0.9)">
      <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#f1f5f9" stroke-width="2"/>
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#starYellow)"/>
    </g>
  </g>
</svg>
